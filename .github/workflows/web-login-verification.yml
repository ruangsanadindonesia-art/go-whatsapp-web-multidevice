name: Temporary Web Login Verification
on:
  push:
    branches: [feature/gowa-ui-web-login-14d]
permissions:
  contents: read
jobs:
  auth-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Targeted authentication tests
        working-directory: src
        run: go test -tags purego ./cmd -count=1
      - name: Static analysis
        working-directory: src
        run: go vet -tags purego ./cmd
      - name: Format preview for code review
        run: |
          gofmt -w src/cmd/web_auth.go src/cmd/web_auth_test.go
          echo 'GOWA_FORMAT:web_auth.go:BEGIN'
          base64 -w0 src/cmd/web_auth.go
          echo
          echo 'GOWA_FORMAT:web_auth.go:END'
          echo 'GOWA_FORMAT:web_auth_test.go:BEGIN'
          base64 -w0 src/cmd/web_auth_test.go
          echo
          echo 'GOWA_FORMAT:web_auth_test.go:END'
