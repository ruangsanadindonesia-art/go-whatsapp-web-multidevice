name: GoWA Integrations UI Test
on:
  pull_request:
    paths:
      - "src/cmd/integrations_page*.go"
      - "src/cmd/rest.go"
      - "src/cmd/root.go"
      - "src/config/settings.go"
      - ".github/workflows/integrations-page-ci.yml"
  workflow_dispatch:

jobs:
  integration-page:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Verify formatting
        run: |
          test -z "$(gofmt -l src/cmd/integrations_page.go src/cmd/integrations_page_test.go)"
      - name: Verify integration management and route order
        working-directory: src
        run: go test ./cmd -run 'TestIntegrationsPage|TestDeviceGroupIsRegisteredLast' -count=1
