name: GoWA Integrations UI Test
on:
  pull_request:
    paths:
      - "src/cmd/integrations_page*.go"
      - "src/cmd/private_api_*.go"
      - "src/cmd/rest.go"
      - "src/cmd/root.go"
      - "src/config/settings.go"
      - ".github/workflows/integrations-page-ci.yml"
  workflow_dispatch:

jobs:
  integration-page:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Parse Go source
        run: gofmt -e src/cmd/integrations_page.go src/cmd/integrations_page_test.go src/cmd/private_api_*.go > /dev/null
      - name: Verify integration management and route order
        working-directory: src
        run: go test ./cmd -run 'TestPrivateAPI|TestIntegrationsPage|TestDeviceGroupIsRegisteredLast' -count=1
      - name: Related cmd regression
        working-directory: src
        run: go test ./cmd -count=1
