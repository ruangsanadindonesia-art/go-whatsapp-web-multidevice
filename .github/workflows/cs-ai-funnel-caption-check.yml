name: Temporary cs-ai-funnel-caption-check
on:
  push:
    branches: [feature/cs-ai-funnel-caption]
permissions:
  contents: read
jobs:
  targeted-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/hermes-cs-bridge/go.mod
          cache: false
      - name: Test and vet related code
        working-directory: integrations/hermes-cs-bridge
        run: go test ./... -count=1 && go vet ./...
