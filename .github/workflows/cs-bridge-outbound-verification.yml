name: Temporary CS Bridge Outbound Verification
on:
  push:
    branches: [feature/cs-bridge-outbound]
permissions:
  contents: read
jobs:
  test-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/hermes-cs-bridge/go.mod
          cache: false
      - name: Unit and race tests
        working-directory: integrations/hermes-cs-bridge
        run: go test -race ./...
      - name: Static analysis
        working-directory: integrations/hermes-cs-bridge
        run: go vet ./...
